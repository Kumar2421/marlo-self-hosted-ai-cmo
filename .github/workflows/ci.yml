name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-base-guard:
    # A PR's base defaults to whatever branch was checked out when it was
    # created, so it's easy to open one against a stale feature branch by
    # accident. That already cost this repo a shipped fix: PR #22 was merged
    # into `feat/production-runtime-readiness` (34 commits behind main),
    # GitHub reported it as MERGED and deleted the branch, and the
    # multi-tenant isolation fix it carried never reached main or production
    # -- silently, for ~12 hours, until someone diffed main by hand.
    #
    # This makes that mistake loud instead of silent. Targeting a non-main
    # base is still allowed (stacked PRs are legitimate) -- it just has to be
    # deliberate enough to say so in the PR body.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            echo "Base is main."
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -qiF 'intentional-base'; then
            echo "Base is '$BASE_REF' -- explicitly acknowledged via 'intentional-base' in the PR body."
            exit 0
          fi
          echo "::error::This PR targets '$BASE_REF', not 'main'."
          echo ""
          echo "Merging here does NOT ship to main or production. GitHub will still"
          echo "report the PR as MERGED, which is how PR #22's fix was silently lost."
          echo ""
          echo "If this is wrong (the usual case), retarget it:"
          echo "    gh pr edit <number> --base main"
          echo ""
          echo "If a stacked PR onto '$BASE_REF' really is intended, add the word"
          echo "'intentional-base' to the PR description to acknowledge it."
          exit 1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.mts' '*.cts')
          if [ -z "$files" ]; then
            echo "No JavaScript/TypeScript files changed."
          else
            printf 'Linting changed files:\n%s\n' "$files"
            printf '%s\n' "$files" | xargs npx eslint
          fi
      - name: Full repository lint (informational)
        run: npm run lint
        continue-on-error: true
      - name: Unit tests
        shell: bash
        # bash runs with pipefail, so a failing npm test still fails this step through tee.
        run: npm test 2>&1 | tee test.log
      - name: Fail if no tests ran
        # node --test exits 0 when it finds zero files; the TAP summary is the real signal.
        shell: bash
        run: grep -E '^# tests [1-9]' test.log
      - name: Production build
        run: npm run build
